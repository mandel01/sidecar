<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spaces</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app">
    <div id="favorites" data-zone="favorites"></div>

    <header id="space-header">
      <span id="space-icon"></span>
      <span id="space-name" title="Double-click to rename"></span>
      <button class="icon-btn" id="new-folder-btn" title="New folder">
        <svg viewBox="0 0 16 16"><path d="M1.5 4.5v8a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H8L6.5 3.5h-4a1 1 0 0 0-1 1Z"/><path d="M8 7.5v4M6 9.5h4"/></svg>
      </button>
      <button class="icon-btn" id="space-menu-btn" title="Space options">
        <svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.1"/><circle cx="8" cy="8" r="1.1"/><circle cx="12.5" cy="8" r="1.1"/></svg>
      </button>
    </header>

    <div id="scroll">
      <div id="pinned" data-zone="pinned"></div>
      <div id="divider">
        <span class="line"></span>
        <button id="clear-btn" title="Archive all unpinned tabs in this space">↓ Clear</button>
      </div>
      <div id="unpinned" data-zone="unpinned">
        <div id="new-tab" class="new-tab" title="New tab (⌘T / Ctrl+T also works)">
          <span class="plus">+</span><span>New Tab</span>
        </div>
        <div id="tab-list"></div>
      </div>
    </div>

    <footer id="bottom">
      <button class="icon-btn" id="archive-btn" title="Archived tabs">
        <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="3" rx="1"/><path d="M2.5 5.5v7a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-7M6.5 8.5h3"/></svg>
      </button>
      <div id="spaces"></div>
      <button class="icon-btn" id="add-space-btn" title="New space">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
      <button class="icon-btn" id="settings-btn" title="Settings">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
      </button>
    </footer>
  </div>

  <div id="menu" hidden></div>
  <div id="toast" hidden></div>
  <dialog id="dialog"></dialog>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
