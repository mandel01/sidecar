<!doctype html>
<!-- Replaces Chrome's New Tab page, so the bookmarks bar doesn't pop in and out
     on ⌘T. Chrome puts the cursor in the address bar for override pages. -->
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #f4f4f6; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1b1b1f; }
  }
</style>
</head>
<body></body>
</html>
